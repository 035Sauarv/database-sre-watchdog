version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
      nodejs: 20
    commands:
      - echo "Installing backend dependencies..."
      - cd backend
      - pip install -r requirements.txt
      - cd ..

      - echo "Installing frontend dependencies..."
      - cd frontend
      - npm install
      - cd ..

  pre_build:
    commands:
      - echo "Skipping test checks..."

  build:
    commands:
      - echo "Building React application..."
      - cd frontend
      - npm run build
      - cd ..

artifacts:
  files:
    - 'backend/**/*'
    - 'frontend/build/**/*'
    - 'appspec.yml'
    - 'scripts/**/*'