version: 0.2

phases:
  install:
    runtime-versions:
      python: 3.11
      nodejs: 20
    commands:
      - echo "Installing FastAPI environment components..."
      - cd backend && pip install -r requirements.txt && cd ..
      - echo "Installing UI interface ecosystem packages..."
      - cd frontend && npm install && cd ..

  pre_build:
    commands:
      - echo "Skipping test checks..."

  build:
    commands:
      - echo "Compiling frontend assets into production distributions..."
      - cd frontend && CI=false DISABLE_ESLINT_PLUGIN=true npm run build && cd ..

artifacts:
  files:
    - 'backend/**/*'
    - 'frontend/build/**/*'
    - 'appspec.yml'
    - 'scripts/**/*'